# The no-GPU half of the gate.
#
# The checks live in `engine/Makefile`'s `check` target and this workflow runs
# that target -- one list, so the two cannot drift (they did once:
# check_q16_decode.sh was missing here until 2026-11-17).  `check` builds the
# engine (warncheck), runs the compiled tests, the documentation and source
# gates, the shader digests, the container constants and the server self-test.
#
# What is left here is what `make check` does not do: the eval case file's
# self-check, shell and Python syntax, and the tool CLIs.  The model-dependent
# half (golden strings, PPL, swap_matrix.py) needs the containers in models/
# and a GL driver, so it stays on the machines that have them.

name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  no-gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install GL headers (the engine links them even for --dump-shaders)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make libegl1-mesa-dev libgles2-mesa-dev

      # Warns, builds once (warncheck), and runs every no-GPU check including
      # the compiled tests.  One step is deliberate: the per-check step list
      # this replaced was a second copy of the gate, and it drifted.
      - name: the no-GPU gate (engine/Makefile check target)
        run: make -C engine check

      - name: eval case file self-check
        run: python3 engine/eval/eval_ifeval.py --selftest

      - name: shell syntax
        run: |
          set -eu
          n=0
          for f in $(git ls-files '*.sh'); do
            case "$(head -1 "$f")" in
              *bash*)  bash -n "$f" ;;
              *)       sh -n "$f" ;;
            esac
            n=$((n + 1))
          done
          echo "shell syntax ok ($n files)"

      - name: python syntax
        run: |
          set -eu
          python3 - <<'PY'
          import subprocess, sys
          files = subprocess.run(["git", "ls-files", "*.py"], capture_output=True, text=True).stdout.split()
          for f in files:
              compile(open(f, encoding="utf-8").read(), f, "exec")
          print("python syntax ok (%d files)" % len(files))
          PY

      - name: tool CLIs
        run: |
          set -eu
          n=0
          for f in engine/tools/*.py; do
            python3 "$f" --help > /dev/null
            n=$((n + 1))
          done
          echo "tool CLIs ok ($n tools)"
